# Phase 8 Step 6: Alpha360 Training Configuration
# Uses 360 raw lagged OHLCV features (original paper approach)
# Date: 2026-01-13

[file]
# Wavelet-decomposed factor data (same as Alpha158)
traffic = ./data/NIFTY200_Subset10/dataset/flow.npz

# Binary trend indicators (same as Alpha158)
indicator = ./data/NIFTY200_Subset10/dataset/trend_indicator.npz

# Correlation adjacency matrix (same as Alpha158)
adj = ./data/NIFTY200_Subset10/dataset/corr_adj.npy

# Graph embeddings (same as Alpha158)
adjgat = ./data/NIFTY200_Subset10/dataset/128_corr_struc2vec_adjgat.npy

# Directory containing 360 Alpha360 factor CSVs (KEY CHANGE)
factor_dir = ./data/NIFTY200_Subset10/Alpha360

# Model checkpoint save path
model = ./output/NIFTY200_Subset10_Alpha360_Split2/best_model

# Training log path
log = ./output/NIFTY200_Subset10_Alpha360_Split2/training.log

[data]
# Dataset identifier
dataset = NIFTY200_Subset10_Alpha360_Split2

# Lookback window (20 trading days)
T1 = 20

# Prediction horizon (2 days ahead)
T2 = 2

# Training split ratio
train_ratio = 0.65

# Validation split ratio
val_ratio = 0.10

# Test split ratio
test_ratio = 0.25

[train]
# GPU device ID
cuda = 0

# Maximum training epochs (increased for 360 factors)
max_epoch = 100

# Batch size (may need adjustment for 360 factors)
batch_size = 8

# Adam optimizer learning rate
learning_rate = 0.001

# Random seed for reproducibility
seed = 42

[param]
# Number of dual encoder layers
layers = 2

# Number of attention heads
heads = 1

# Hidden dimension size
dims = 128

# Monte Carlo samples
samples = 1

# Wavelet type (Symlet-2)
wave = sym2

# Wavelet decomposition level
level = 1
