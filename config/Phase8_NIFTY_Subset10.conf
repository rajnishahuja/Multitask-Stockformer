# Multitask-Stockformer Configuration for Phase 8: Bear Market Testing
# Subset 10: F&O Stocks (Apr 2020 - Nov 2022)
# Date: 2026-01-11
# Stock Universe: 143 F&O stocks (Apr 2020 bhavcopy)
# Factors: 158 Alpha158 factors (ALL factors, no IC filtering)
# Time Period: 2020-04-01 to 2022-11-30 (662 trading days)
# Focus: Bear market period (Aug-Nov 2022) for comparison with Phase 7 results

[file]
# Wavelet-decomposed factor data (low + high frequency components)
traffic = ./data/NIFTY200_Subset10/dataset/flow.npz

# Binary trend indicators (up=1, down=0)
indicator = ./data/NIFTY200_Subset10/dataset/trend_indicator.npz

# Correlation adjacency matrix for GAT (143x143)
adj = ./data/NIFTY200_Subset10/dataset/corr_adj.npy

# Graph embeddings for spatial positional encoding (143x128)
adjgat = ./data/NIFTY200_Subset10/dataset/128_corr_struc2vec_adjgat.npy

# Directory containing 158 Alpha158 factor CSVs
factor_dir = ./data/NIFTY200_Subset10/Alpha158

# Model checkpoint save path
model = ./output/NIFTY200_Subset10/best_model

# Training log path
log = ./output/NIFTY200_Subset10/training.log

[data]
# Dataset identifier
dataset = NIFTY200_Subset10

# Lookback window (20 trading days)
T1 = 20

# Prediction horizon (2 days ahead)
T2 = 2

# Training split ratio (75% of 662 days = ~496 days: Apr 2020 - Mar 2022)
train_ratio = 0.75

# Validation split ratio (12.5% of 662 days = ~82 days: Apr 2022 - Jun 2022)
val_ratio = 0.125

# Test split ratio (12.5% of 662 days = ~82 days: Jul 2022 - Nov 2022) [BEAR MARKET]
test_ratio = 0.125

[train]
# GPU device ID
cuda = 0

# Maximum training epochs (more factors may need more epochs)
max_epoch = 30

# Batch size (143 stocks, smaller due to 158 factors)
batch_size = 8

# Adam optimizer learning rate
learning_rate = 0.001

# Random seed for reproducibility
seed = 42

[param]
# Number of dual encoder layers
layers = 2

# Number of attention heads
heads = 1

# Hidden dimension size (may need adjustment for 158 factors)
dims = 128

# Monte Carlo samples for uncertainty
samples = 1

# Wavelet type (Symlet-2)
wave = sym2

# Wavelet decomposition level
level = 1
